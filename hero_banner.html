<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instant eSIM - Attention Grabber</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Montserrat:wght@900&family=Poppins:wght@400;600;800&display=swap');

        body {
            margin: 0;
            padding: 0;
            background-color: #0a0a0a;
            font-family: 'Poppins', sans-serif;
            color: #ffffff;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
        }

        .attention-banner {
            width: 100%;
            max-width: 1100px;
            background: radial-gradient(circle, #1a1a1a 0%, #000000 100%);
            border: 5px solid #FFD700;
            border-radius: 25px;
            padding: 60px 40px;
            text-align: center;
            box-shadow: 0 0 80px rgba(255, 215, 0, 0.15), inset 0 0 30px rgba(255, 215, 0, 0.1);
            position: relative;
            overflow: hidden;
            margin: 20px;
        }

        /* Top ribbon */
        .ribbon {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            background-color: #FF0055;
            color: white;
            font-weight: 800;
            letter-spacing: 3px;
            padding: 12px 0;
            text-transform: uppercase;
            font-size: 1.1rem;
            animation: color-shift 3s infinite;
        }

        .main-headline {
            font-family: 'Montserrat', sans-serif;
            font-size: 6.5rem;
            color: #FFD700; /* Bright Yellow */
            margin: 40px 0 10px 0;
            text-transform: uppercase;
            line-height: 1;
            text-shadow: 5px 5px 0px #FF0055;
            letter-spacing: -2px;
        }

        .sub-headline {
            font-size: 2.2rem;
            color: #ffffff;
            margin-bottom: 40px;
            font-weight: 800;
            letter-spacing: 1px;
        }

        .features-container {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 15px;
            margin-bottom: 50px;
        }

        .feature-badge {
            background-color: #111;
            border: 2px solid #333;
            color: #FFF;
            padding: 15px 25px;
            border-radius: 8px;
            font-size: 1.3rem;
            font-weight: 800;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
        }

        .feature-badge:hover {
            border-color: #FFD700;
            transform: translateY(-5px);
            background-color: #222;
        }

        .feature-badge.highlight {
            background-color: #FFD700;
            color: #000;
            border-color: #FFD700;
        }

        .feature-badge.highlight:hover {
            background-color: #FFF;
            border-color: #FFF;
        }

        .cta-area {
            margin-top: 20px;
        }

        .cta-button {
            background-color: #FF0055;
            color: #FFFFFF;
            font-family: 'Montserrat', sans-serif;
            font-size: 2.8rem;
            text-transform: uppercase;
            padding: 25px 60px;
            border-radius: 100px;
            text-decoration: none;
            display: inline-block;
            box-shadow: 0 15px 40px rgba(255, 0, 85, 0.4);
            transition: all 0.3s ease;
            animation: heartbeat 1.5s infinite;
            border: 4px solid #FF0055;
        }

        .cta-button:hover {
            background-color: transparent;
            color: #FF0055;
            transform: scale(1.05);
        }

        .cta-subtext {
            margin-top: 25px;
            font-size: 1.2rem;
            color: #aaaaaa;
            font-weight: 600;
        }

        @keyframes color-shift {
            0% { background-color: #FF0055; }
            50% { background-color: #CC0044; }
            100% { background-color: #FF0055; }
        }

        @keyframes heartbeat {
            0% { transform: scale(1); }
            14% { transform: scale(1.05); }
            28% { transform: scale(1); }
            42% { transform: scale(1.05); }
            70% { transform: scale(1); }
        }

        @media (max-width: 768px) {
            .main-headline { font-size: 4rem; }
            .sub-headline { font-size: 1.5rem; }
            .feature-badge { font-size: 1rem; padding: 12px 18px; }
            .cta-button { font-size: 1.8rem; padding: 15px 30px; }
            .attention-banner { padding: 40px 20px; border-width: 3px; }
        }
    </style>
</head>
<body>

    <div class="attention-banner">
        <div class="ribbon">ANYONE CAN BUY • NO VERIFICATION • ANYONE CAN BUY</div>
        
        <h1 class="main-headline">INSTANT eSIM</h1>
        <div class="sub-headline">Simply login with Gmail or Apple ID</div>

        <div class="features-container">
            <div class="feature-badge">🚫 No Age Limit</div>
            <div class="feature-badge">🚫 No Passport</div>
            <div class="feature-badge">🚫 No ID</div>
            <div class="feature-badge highlight">✅ FREE Setup</div>
            <div class="feature-badge highlight">✅ $0 Hidden Fee</div>
        </div>

        <div class="cta-area">
            <a href="#" class="cta-button">Buy & Activate in 30 Sec!</a>
            <div class="cta-subtext">Secure your global internet instantly.</div>
        </div>
    </div>

</body>
</html>
