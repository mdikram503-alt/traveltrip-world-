<header class="appbar"><div class="wrap inner">

<main class="wrap">
<section class="hero"><h1>Coverage</h1><p class="muted">Partner 4G/5G networks. Speeds follow the local operator.</p></section>
<p class="notice">This map is a catalog list in the source package — swap in Mapbox / Google Maps for production.</p>
<div id="grid" class="grid"></div>
<script>
  fetch("../data/countries.json").then(r=>r.json()).then(({countries}) => {
    document.getElementById("grid").innerHTML = countries.map(c => `<div class="card"><div class="flag">${c.flag}</div><h3>${c.name}</h3><div class="muted">${c.region} · ${c.fiveG?"5G":"4G"}</div></div>`).join("");
  });
</script>
</main>
